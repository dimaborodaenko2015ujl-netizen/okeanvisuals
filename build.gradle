plugins {
    id 'fabric-loom' version '1.8.11'
}

version = '1.3.0-test'
group = 'com.okean.visuals'

repositories {
    mavenCentral()

    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.4'
    mappings 'net.fabricmc:yarn:1.21.4+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.15.11'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.110.0+1.21.4'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.register('verifyModJar') {
    dependsOn tasks.named('remapJar')
    doLast {
        def jarFile = tasks.named('remapJar').get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            ['fabric.mod.json', 'com/okean/visuals/OkeanVisuals.class',
             'com/okean/visuals/OkeanVisuals$OkeanMenu.class'].each { entry ->
                if (zip.getEntry(entry) == null) {
                    throw new GradleException("Missing mod entry: " + entry)
                }
            }
        } finally {
            zip.close()
        }
    }
}
tasks.named('build') {
    dependsOn tasks.named('verifyModJar')
}
