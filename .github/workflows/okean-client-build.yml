name: Build Okean Client
on:
  workflow_dispatch:
  push:
    branches: [okean-client-v0-1]
    paths: ['okean-client/**', '.github/workflows/okean-client-build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: okean-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build mod
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OkeanClient-1.21.4
          path: okean-client/build/libs/okean-client-0.1.0.jar
          if-no-files-found: error
