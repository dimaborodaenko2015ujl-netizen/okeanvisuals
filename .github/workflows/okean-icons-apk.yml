name: Okean Icons APK
on:
  push:
    branches: [okean-icons-apk-2026]
  pull_request:
    branches: [main]
    paths: [ 'OkeanIcons/**', '.github/workflows/okean-icons-apk.yml' ]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: OkeanIcons
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OkeanIcons-apk
          path: OkeanIcons/app/build/outputs/apk/debug/*.apk
